{% extends "layout.html" %}

{% block title %}Login - Premium Train Booking{% endblock %}

{% block content %}
<section class="pt-5 mt-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-train text-primary" style="font-size: 3rem;"></i>
                            <h3 class="mt-2">Welcome Back!</h3>
                            <p class="text-muted">Login to manage your bookings</p>
                        </div>

                        <form method="POST" action="{{ url_for('login') }}">
                            <input type="hidden" name="next" value="{{ next }}">
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" name="email" 
                                       placeholder="Enter your email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" name="password" 
                                       placeholder="Enter your password" required>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label" for="remember">Remember me</label>
                            </div>
                            <button type="submit" class="btn btn-gradient w-100">
                                <i class="fas fa-sign-in-alt"></i> Login
                            </button>
                        </form>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="text-muted">Don't have an account?</p>
                            <a href="{{ url_for('register') }}" class="btn btn-outline-primary">
                                <i class="fas fa-user-plus"></i> Create Account
                            </a>
                        </div>

                        <div class="text-center mt-3">
                            <small class="text-muted">
                                <i class="fas fa-lock"></i> Your data is secure
                            </small>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <small class="text-muted">Demo: demo@example.com / password123</small>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
